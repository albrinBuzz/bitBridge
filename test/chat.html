<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBridge Activity | Dark Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Colores más profundos y legibles */
            --bg-chat: #05070a; /* Fondo ultra oscuro */
            --bg-header: #0d1117;
            --accent-cyan: #00ffc8;
            --bubble-sent: #0d2a24; /* Verde esmeralda muy oscuro */
            --bubble-received: #161b22; /* Gris azulado profundo */
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --border: #30363d;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0; height: 100%;
            background-color: var(--bg-chat);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* HEADER REFINADO */
        .chat-header {
            background: var(--bg-header);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .back-btn {
            color: var(--accent-cyan);
            font-size: 1.1rem;
            text-decoration: none;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: var(--glass);
            transition: 0.3s;
        }

        .back-btn:hover { background: rgba(0, 255, 200, 0.1); transform: translateX(-3px); }

        .chat-info { flex: 1; }
        .chat-info h2 { margin: 0; font-size: 1rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .chat-info span { font-size: 0.75rem; color: var(--accent-cyan); font-family: monospace; }

        /* CUERPO DEL CHAT - MEJOR LEGIBILIDAD */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px;
            /* Fondo con patrón técnico sutil */
            background-image: radial-gradient(var(--border) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            display: flex; flex-direction: column; gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        /* BURBUJAS DE MENSAJE */
        .msg {
            max-width: 85%;
            padding: 12px;
            border-radius: 12px;
            position: relative;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.received {
            align-self: flex-start;
            background: var(--bubble-received);
            border-bottom-left-radius: 2px;
        }

        .msg.sent {
            align-self: flex-end;
            background: var(--bubble-sent);
            border-bottom-right-radius: 2px;
            border-color: rgba(0, 255, 200, 0.2);
        }

        /* CONTENEDOR DE ARCHIVO ESTILO COMPONENTE */
        .file-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex; align-items: center; gap: 14px;
            color: var(--text-main);
            text-decoration: none;
            margin-top: 5px;
            transition: 0.2s;
        }

        .file-box:hover { border-color: var(--accent-cyan); background: rgba(0, 0, 0, 0.6); }

        .file-box i { font-size: 1.8rem; color: var(--accent-cyan); }

        .file-details { flex: 1; overflow: hidden; }
        .file-details .name {
            font-weight: 600;
            display: block;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Consolas', monospace;
        }
        .file-details .meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

        .time { font-size: 0.65rem; text-align: right; color: var(--text-dim); margin-top: 6px; font-family: monospace; }

        /* FOOTER / INPUT */
        .chat-footer {
            background: var(--bg-header);
            padding: 15px 20px;
            display: flex; align-items: center; gap: 12px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            width: 42px; height: 42px;
            border-radius: 10px; border: 1px solid var(--border);
            background: var(--bubble-received);
            color: var(--text-dim);
            font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }

        .action-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        .input-area {
            flex: 1; background: #010409;
            border-radius: 10px; padding: 12px 15px;
            font-size: 0.9rem; color: var(--text-dim);
            border: 1px solid var(--border);
            display: flex; align-items: center;
            font-family: monospace;
        }

        .send-btn {
            background: var(--accent-cyan);
            color: var(--bg-chat);
            border: none;
            font-weight: bold;
        }

        .send-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* SCROLLBAR CUSTOM */
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<header class="chat-header">
    <a href="index.html" class="back-btn">
        <i class="fas fa-chevron-left"></i>
    </a>
    <div class="chat-info">
        <h2>Activity Log</h2>
        <span>[STATUS: ENCRYPTED_CHANNEL]</span>
    </div>
    <div class="header-actions">
        <button class="action-btn" style="border:none; background:transparent;"><i class="fas fa-search"></i></button>
    </div>
</header>

<main class="chat-body" id="chatArea">
    <!-- Fecha Separador -->
    <div style="text-align: center; margin: 10px 0;">
        <span style="font-size: 0.7rem; background: var(--border); padding: 4px 12px; border-radius: 20px; color: var(--text-dim); text-transform: uppercase;">Hoy</span>
    </div>

    <!-- Ejemplo Recibido -->
    <div class="msg received">
        <div style="color: var(--accent-cyan); font-size: 0.7rem; font-family: monospace; margin-bottom: 6px; font-weight: bold;">
            <i class="fas fa-server"></i> Fedora-Node_01
        </div>
        <a href="#" class="file-box">
            <i class="fas fa-database"></i>
            <div class="file-details">
                <span class="name">dump_kiosko_v2.sql</span>
                <span class="meta">842 KB • SQL DATA</span>
            </div>
            <i class="fas fa-chevron-right" style="font-size: 0.8rem; opacity: 0.5;"></i>
        </a>
        <div class="time">20:05 PM</div>
    </div>

    <!-- Ejemplo Enviado -->
    <div class="msg sent">
        <div style="color: #4cd137; font-size: 0.7rem; font-family: monospace; margin-bottom: 6px; font-weight: bold; text-align: right;">
            <i class="fas fa-user-check"></i> Cristobal
        </div>
        <a href="#" class="file-box" style="background: rgba(0, 255, 200, 0.05);">
            <i class="fas fa-file-code"></i>
            <div class="file-details">
                <span class="name">NioEngine.java</span>
                <span class="meta">15.4 KB • JAVA SOURCE</span>
            </div>
        </a>
        <div class="time">20:10 PM • <i class="fas fa-check-double" style="color: var(--accent-cyan);"></i></div>
    </div>
</main>

<footer class="chat-footer">
    <button class="action-btn" title="Adjuntar" onclick="document.getElementById('fileIn').click()">
        <i class="fas fa-paperclip"></i>
    </button>
    <input type="file" id="fileIn" style="display:none">

    <div class="input-area">
        Esperando interacción o archivo...
    </div>

    <button class="action-btn send-btn">
        <i class="fas fa-paper-plane"></i>
    </button>
</footer>

</body>
</html>
